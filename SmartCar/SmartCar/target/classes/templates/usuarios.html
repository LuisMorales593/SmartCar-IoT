<div th:fragment="content">
    <h2>Gestión de Usuarios</h2>

    <div class="card">
        <h3>Registrar usuario</h3>
        <form th:action="@{/web/usuarios/guardar}" th:object="${usuario}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label>Nombre:</label>
                <input type="text" th:field="*{nombre}" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" th:field="*{email}" required>
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" th:field="*{password}" required>
            </div>
            <div class="form-group">
                <label>Rol:</label>
                <input type="text" th:field="*{rol}" required>
            </div>
            <div class="form-group">
                <label>Activo:</label>
                <select th:field="*{activo}">
                    <option th:value="true">Sí</option>
                    <option th:value="false">No</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>
        </form>
    </div>

    <div class="card">
        <h3>Usuarios registrados</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Activo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.id}">1</td>
                    <td th:text="${u.nombre}">Usuario</td>
                    <td th:text="${u.email}">user@mail.com</td>
                    <td th:text="${u.rol}">admin</td>
                    <td th:text="${u.activo} ? 'Sí' : 'No'">Sí</td>
                    <td>
                        <div class="acciones">
                            <a th:href="@{/web/usuarios/editar/{id}(id=${u.id})}" class="btn btn-edit">Editar</a>
                            <a th:href="@{/web/usuarios/eliminar/{id}(id=${u.id})}" 
                               class="btn btn-delete" 
                               onclick="return confirm('¿Eliminar este usuario?')">Eliminar</a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
