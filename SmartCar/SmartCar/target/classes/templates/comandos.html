<div th:fragment="content">
    <h2>Historial de Comandos</h2>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Vehículo ID</th>
                    <th>Usuario ID</th>
                    <th>Tipo</th>
                    <th>Valor</th>
                    <th>Fecha</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${comandos}">
                    <td th:text="${c.id}">1</td>
                    <td th:text="${c.vehiculoId}">1</td>
                    <td th:text="${c.usuarioId}">1</td>
                    <td th:text="${c.tipo}">direccion</td>
                    <td th:text="${c.valor}">adelante</td>
                    <td th:text="${c.fecha}">2026-07-04</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
