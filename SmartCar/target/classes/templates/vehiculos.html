<div th:fragment="content">
    <h2>Gestión de Vehículos</h2>

    <div class="card">
        <h3>Registrar nuevo vehículo</h3>
        <form th:action="@{/web/vehiculos/guardar}" th:object="${vehiculo}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label>Nombre:</label>
                <input type="text" th:field="*{nombre}" required>
            </div>
            <div class="form-group">
                <label>Modelo:</label>
                <input type="text" th:field="*{modelo}" required>
            </div>
            <div class="form-group">
                <label>Controlador:</label>
                <input type="text" th:field="*{controlador}" required>
            </div>
            <div class="form-group">
                <label>Estado:</label>
                <input type="text" th:field="*{estado}" required>
            </div>
            <div class="form-group">
                <label>IP:</label>
                <input type="text" th:field="*{ip}" required>
            </div>
            <div class="form-group">
                <label>URL Stream:</label>
                <input type="text" th:field="*{urlStream}">
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>
        </form>
    </div>

    <div class="card">
        <h3>Vehículos registrados</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Modelo</th>
                    <th>Controlador</th>
                    <th>Estado</th>
                    <th>IP</th>
                    <th>URL Stream</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="v : ${vehiculos}">
                    <td th:text="${v.id}">1</td>
                    <td th:text="${v.nombre}">Auto</td>
                    <td th:text="${v.modelo}">Sedan</td>
                    <td th:text="${v.controlador}">Joystick</td>
                    <td th:text="${v.estado}">Conectado</td>
                    <td th:text="${v.ip}">192.168.1.1</td>
                    <td th:text="${v.urlStream}">-</td>
                    <td>
                        <a th:href="@{/web/vehiculos/editar/{id}(id=${v.id})}" class="btn btn-edit">Editar</a>
                        <a th:href="@{/web/vehiculos/eliminar/{id}(id=${v.id})}" 
                           class="btn btn-delete" 
                           onclick="return confirm('¿Eliminar este vehículo?')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
